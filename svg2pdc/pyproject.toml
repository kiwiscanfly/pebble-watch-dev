[project]
name = "svg2pdc"
version = "0.1.0"
description = "Convert SVG images to Pebble Draw Command (PDC) format for Pebble watchfaces."
requires-python = ">=3.10"
dependencies = [
    "svg.path>=6.3",
]

[project.scripts]
svg2pdc = "svg2pdc.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/svg2pdc"]
